plugins {
    id 'com.android.application'
    id 'androidx.navigation.safeargs.kotlin'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

def gitDescription = providers.exec {
    commandLine 'git', 'describe', '--tags', '--always'
}.standardOutput.asText.map { description -> description.trim() }

def gitVersion = gitDescription.map { description ->
    def semanticVersion = description =~
        /^(v?)(\d+)\.(\d+)\.(\d+)(?:-(\d+)-g([0-9a-f]+))?$/
    if (!semanticVersion.matches()) {
        throw new GradleException(
            "Cannot derive the version from '${description}'. Add a semantic version tag such as v1.2.3."
        )
    }

    def prefix = semanticVersion[0][1]
    def major = semanticVersion[0][2] as int
    def minor = semanticVersion[0][3] as int
    def patch = semanticVersion[0][4] as int
    def distanceText = semanticVersion[0][5]
    def distance = distanceText ? distanceText as int : 0
    def commit = semanticVersion[0][6]
    if (minor > 99 || patch > 99 || distance > 999) {
        throw new GradleException(
            "Version '${description}' exceeds the supported versionCode ranges."
        )
    }

    def versionName = distance == 0
        ? description
        : "${prefix}${major}.${minor}.${patch + 1}-p${distance}+g${commit}"
    def versionCode = Math.max(
        1,
        major * 10_000_000 + minor * 100_000 + patch * 1_000 + distance
    )

    [name: versionName, code: versionCode]
}

def gitVersionName = gitVersion.map { version -> version.name }
def gitVersionCode = gitVersion.map { version -> version.code }

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.isFile()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def nonBlank = { value -> value?.trim() ? value : null }
def releaseStoreFile = nonBlank(keystoreProperties.getProperty('storeFile'))
def releaseStorePassword = nonBlank(keystoreProperties.getProperty('storePassword')) ?:
    System.getenv('LEVELER_STORE_PASSWORD')
def releaseKeyAlias = nonBlank(keystoreProperties.getProperty('keyAlias'))
def releaseKeyPassword = nonBlank(keystoreProperties.getProperty('keyPassword')) ?:
    System.getenv('LEVELER_KEY_PASSWORD')
def hasReleaseSigningConfig = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null }
def releaseBuildRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains('release')
}

if (releaseBuildRequested && !hasReleaseSigningConfig) {
    throw new GradleException(
        'Release signing is incomplete. Fill keystore.properties or set ' +
            'LEVELER_STORE_PASSWORD and LEVELER_KEY_PASSWORD.'
    )
}

android {
    namespace = 'de.energy6.caravanleveler'
    compileSdk = 37

    defaultConfig {
        applicationId = 'de.energy6.caravanleveler'
        minSdk = 34
        targetSdk = 37
        versionCode = gitVersionCode.get()
        versionName = gitVersionName.get()

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                storeFile = rootProject.file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures.viewBinding = true
    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(
                output.versionName.map { version -> "CaravanLeveler-${version}.apk" }
            )
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_4
        apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_4
    }
}

dependencies {
    ksp 'com.google.dagger:hilt-compiler:2.60.1'

    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'com.gorisse.thomas.sceneform:sceneform:1.23.0'
    implementation 'com.google.ar:core:1.56.0'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.10.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'com.google.dagger:hilt-android:2.60.1'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.4.0'
    testImplementation 'org.hamcrest:hamcrest:3.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.navigation:navigation-testing:2.10.2'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
}
