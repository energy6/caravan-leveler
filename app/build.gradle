abstract class RenameFileArtifactTask extends DefaultTask {
    @org.gradle.api.tasks.InputFile
    abstract org.gradle.api.file.RegularFileProperty getInputFile()

    @org.gradle.api.tasks.OutputFile
    abstract org.gradle.api.file.RegularFileProperty getOutputFile()

    @org.gradle.api.tasks.TaskAction
    void renameArtifact() {
        def source = inputFile.get().asFile.toPath()
        def target = outputFile.get().asFile.toPath()
        java.nio.file.Files.createDirectories(target.parent)
        java.nio.file.Files.copy(
            source,
            target,
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
}

abstract class VerifyBundlePageAlignmentTask extends DefaultTask {
    @org.gradle.api.tasks.InputFile
    abstract org.gradle.api.file.RegularFileProperty getBundleFile()

    @org.gradle.api.tasks.Classpath
    abstract org.gradle.api.file.ConfigurableFileCollection getBundletoolClasspath()

    @javax.inject.Inject
    abstract org.gradle.process.ExecOperations getExecOperations()

    @org.gradle.api.tasks.TaskAction
    void verifyAlignment() {
        def output = new ByteArrayOutputStream()
        execOperations.javaexec { spec ->
            spec.classpath(bundletoolClasspath)
            spec.mainClass.set('com.android.tools.build.bundletool.BundleToolMain')
            spec.args(
                'dump',
                'config',
                "--bundle=${bundleFile.get().asFile.absolutePath}"
            )
            spec.standardOutput = output
        }.assertNormalExitValue()

        def bundleConfig = output.toString('UTF-8')
        logger.lifecycle(bundleConfig.trim())
        if (!bundleConfig.contains('PAGE_ALIGNMENT_16K')) {
            throw new GradleException(
                'Release AAB does not request PAGE_ALIGNMENT_16K.'
            )
        }
    }
}

abstract class BuildApksFromBundleTask extends DefaultTask {
    @org.gradle.api.tasks.InputFile
    abstract org.gradle.api.file.RegularFileProperty getBundleFile()

    @org.gradle.api.tasks.OutputFile
    abstract org.gradle.api.file.RegularFileProperty getApksFile()

    @org.gradle.api.tasks.Classpath
    abstract org.gradle.api.file.ConfigurableFileCollection getBundletoolClasspath()

    @org.gradle.api.tasks.Nested
    abstract org.gradle.api.provider.Property<com.android.build.api.variant.Aapt2> getAapt2Input()

    @javax.inject.Inject
    abstract org.gradle.process.ExecOperations getExecOperations()

    @org.gradle.api.tasks.TaskAction
    void buildApks() {
        execOperations.javaexec { spec ->
            spec.classpath(bundletoolClasspath)
            spec.mainClass.set('com.android.tools.build.bundletool.BundleToolMain')
            spec.args(
                'build-apks',
                "--bundle=${bundleFile.get().asFile.absolutePath}",
                "--output=${apksFile.get().asFile.absolutePath}",
                "--aapt2=${aapt2Input.get().executable.get().asFile.absolutePath}",
                '--overwrite'
            )
        }.assertNormalExitValue()
    }
}

abstract class InstallApksFromBundleTask extends DefaultTask {
    @org.gradle.api.tasks.InputFile
    abstract org.gradle.api.file.RegularFileProperty getApksFile()

    @org.gradle.api.tasks.InputFile
    abstract org.gradle.api.file.RegularFileProperty getAdbExecutable()

    @org.gradle.api.tasks.Classpath
    abstract org.gradle.api.file.ConfigurableFileCollection getBundletoolClasspath()

    @javax.inject.Inject
    abstract org.gradle.process.ExecOperations getExecOperations()

    @org.gradle.api.tasks.TaskAction
    void installApks() {
        execOperations.javaexec { spec ->
            spec.classpath(bundletoolClasspath)
            spec.mainClass.set('com.android.tools.build.bundletool.BundleToolMain')
            spec.args(
                'install-apks',
                "--apks=${apksFile.get().asFile.absolutePath}",
                "--adb=${adbExecutable.get().asFile.absolutePath}"
            )
        }.assertNormalExitValue()
    }
}

def gitDescription = providers.exec {
    commandLine 'git', 'describe', '--tags', '--always'
}.standardOutput.asText.map { description -> description.trim() }

def gitVersion = gitDescription.map { description ->
    def semanticVersion = description =~
        /^(v?)(\d+)\.(\d+)\.(\d+)(?:-(\d+)-g([0-9a-f]+))?$/
    if (!semanticVersion.matches()) {
        throw new GradleException(
            "Cannot derive the version from '${description}'. Add a semantic version tag such as v1.2.3."
        )
    }

    def prefix = semanticVersion[0][1]
    def major = semanticVersion[0][2] as int
    def minor = semanticVersion[0][3] as int
    def patch = semanticVersion[0][4] as int
    def distanceText = semanticVersion[0][5]
    def distance = distanceText ? distanceText as int : 0
    def commit = semanticVersion[0][6]
    if (minor > 99 || patch > 99 || distance > 999) {
        throw new GradleException(
            "Version '${description}' exceeds the supported versionCode ranges."
        )
    }

    def versionName = distance == 0
        ? description
        : "${prefix}${major}.${minor}.${patch + 1}-p${distance}+g${commit}"
    def versionCode = Math.max(
        1,
        major * 10_000_000 + minor * 100_000 + patch * 1_000 + distance
    )

    [name: versionName, code: versionCode]
}

def gitVersionName = gitVersion.map { version -> version.name }
def gitVersionCode = gitVersion.map { version -> version.code }

base {
    archivesName = gitVersionName.map { version -> "CaravanLeveler-${version}" }
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.isFile()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def nonBlank = { value -> value?.trim() ? value : null }
def releaseStoreFile = nonBlank(keystoreProperties.getProperty('storeFile'))
def releaseStorePassword = nonBlank(keystoreProperties.getProperty('storePassword')) ?:
    System.getenv('LEVELER_STORE_PASSWORD')
def releaseKeyAlias = nonBlank(keystoreProperties.getProperty('keyAlias'))
def releaseKeyPassword = nonBlank(keystoreProperties.getProperty('keyPassword')) ?:
    System.getenv('LEVELER_KEY_PASSWORD')
def hasReleaseSigningConfig = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null }
def releaseBuildRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains('release')
}

if (releaseBuildRequested && !hasReleaseSigningConfig) {
    throw new GradleException(
        'Release signing is incomplete. Fill keystore.properties or set ' +
            'LEVELER_STORE_PASSWORD and LEVELER_KEY_PASSWORD.'
    )
}

android {
    namespace = 'de.energy6.caravanleveler'
    compileSdk = 37

    defaultConfig {
        applicationId = 'de.energy6.caravanleveler'
        minSdk = 34
        targetSdk = 37
        versionCode = gitVersionCode.get()
        versionName = gitVersionName.get()

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                storeFile = rootProject.file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
        }
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding = true
        compose = true
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

configurations {
    bundletoolCli
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def variantSuffix = variant.buildType == 'release' ? '' : "-${variant.name}"
        variant.outputs.each { output ->
            output.outputFileName.set(
                output.versionName.map { version ->
                    "CaravanLeveler-${version}${variantSuffix}.apk"
                }
            )
        }
    }

    onVariants(selector().withBuildType('release')) { variant ->
        def artifactBaseName = gitVersionName.map { version ->
            "CaravanLeveler-${version}"
        }
        def bundleFileName = artifactBaseName.map { name -> "${name}.aab" }
        def renameBundle = tasks.register(
            "rename${variant.name.capitalize()}Bundle",
            RenameFileArtifactTask
        )
        variant.artifacts
            .use(renameBundle)
            .wiredWithFiles(
                RenameFileArtifactTask::getInputFile,
                RenameFileArtifactTask::getOutputFile
            )
            .withName(bundleFileName.get())
            .toTransform(
                com.android.build.api.artifact.SingleArtifact.BUNDLE.INSTANCE
            )

        def releaseBundle = variant.artifacts.get(
            com.android.build.api.artifact.SingleArtifact.BUNDLE.INSTANCE
        )
        def releaseApks = layout.buildDirectory.file(
            artifactBaseName.map { name -> "outputs/apks/release/${name}.apks" }
        )

        tasks.register('verifyReleaseBundlePageAlignment', VerifyBundlePageAlignmentTask) {
            group = 'verification'
            description = 'Verifies that the release AAB requests 16 KB native-library alignment.'
            dependsOn 'bundleRelease'

            bundleFile = releaseBundle
            bundletoolClasspath.from(configurations.bundletoolCli)
        }

        tasks.register('buildReleaseApksFromBundle', BuildApksFromBundleTask) {
            group = 'build'
            description = 'Builds a device-installable APK set from the release AAB.'
            dependsOn 'bundleRelease'

            bundleFile = releaseBundle
            apksFile = releaseApks
            bundletoolClasspath.from(configurations.bundletoolCli)
            aapt2Input = androidComponents.sdkComponents.aapt2
        }

        tasks.register('installReleaseApksFromBundle', InstallApksFromBundleTask) {
            group = 'install'
            description = 'Installs the release AAB-derived APK set on the connected Android device.'
            dependsOn 'buildReleaseApksFromBundle'

            apksFile = releaseApks
            adbExecutable = androidComponents.sdkComponents.adb
            bundletoolClasspath.from(configurations.bundletoolCli)
        }
    }
}

