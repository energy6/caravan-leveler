name: CI

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37.0
        run: android sdk install build-tools/36.0.0 platforms/android-37.0

      - name: Verify release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"

      - name: Run unit tests and lint
        run: ./gradlew test lintDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          script: ./gradlew connectedDebugAndroidTest

      - name: Archive instrumented-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CaravanLeveler-android-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build debug APK for pull request
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew assembleDebug
          scripts/verify-16kb-alignment.sh app/build/outputs/apk/debug/*.apk

      - name: Build signed release artifacts
        if: github.event_name != 'pull_request'
        env:
          LEVELER_KEYSTORE_BASE64: ${{ secrets.LEVELER_KEYSTORE_BASE64 }}
          LEVELER_STORE_PASSWORD: ${{ secrets.LEVELER_STORE_PASSWORD }}
          LEVELER_KEY_ALIAS: ${{ secrets.LEVELER_KEY_ALIAS }}
          LEVELER_KEY_PASSWORD: ${{ secrets.LEVELER_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for variable in \
            LEVELER_KEYSTORE_BASE64 \
            LEVELER_STORE_PASSWORD \
            LEVELER_KEY_ALIAS \
            LEVELER_KEY_PASSWORD
          do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Required repository secret ${variable} is not configured."
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/leveler-release-keystore.jks"
          properties="$GITHUB_WORKSPACE/keystore.properties"
          trap 'rm -f "$keystore" "$properties"' EXIT
          printf '%s' "$LEVELER_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          printf 'storeFile=%s\nkeyAlias=%s\n' \
            "$keystore" "$LEVELER_KEY_ALIAS" > "$properties"
          chmod 600 "$properties"

          ./gradlew lintRelease assembleRelease bundleRelease verifyReleaseBundlePageAlignment
          scripts/verify-16kb-alignment.sh app/build/outputs/apk/release/*.apk

      - name: Archive pull-request APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: CaravanLeveler-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Archive release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: CaravanLeveler-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Archive release AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: CaravanLeveler-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach release artifacts
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v8
        with:
          name: CaravanLeveler-apk
          path: release-apk

      - name: Download release AAB
        uses: actions/download-artifact@v8
        with:
          name: CaravanLeveler-aab
          path: release-aab

      - name: Attach artifacts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$RELEASE_TAG"
          release-apk/*.apk
          release-aab/*.aab
          --clobber
