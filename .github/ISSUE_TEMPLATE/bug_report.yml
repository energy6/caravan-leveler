name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: >-
        Do not include signing material, credentials, or private Bluetooth
        addresses. Report security vulnerabilities privately as described in
        SECURITY.md.
  - type: input
    id: version
    attributes:
      label: App version
      description: Version name or commit hash
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android device
      description: Device model and Android version
    validations:
      required: true
  - type: dropdown
    id: sensor
    attributes:
      label: Sensor
      options:
        - Built-in Android sensor
        - WITMOTION WT901BLECL
        - Other or unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots if useful.
