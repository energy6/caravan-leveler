buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 9 provides Kotlin support; this selects the current language/compiler.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20'
        classpath 'org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.4.20'
    }
}

plugins {
    id 'com.android.application' version '9.4.1' apply false
    id 'androidx.navigation.safeargs.kotlin' version '2.10.2' apply false
    id 'com.google.devtools.ksp' version '2.3.12' apply false
    id 'com.google.dagger.hilt.android' version '2.60.1' apply false
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}
